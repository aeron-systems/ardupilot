name: Sync from upstream ArduPilot

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/ArduPilot/ardupilot.git
          git fetch upstream master --tags

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Fork is $BEHIND commits behind upstream/master"

      - name: Create or update sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B upstream-sync upstream/master
          git push --force-with-lease origin upstream-sync

      - name: Open or update pull request
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEHIND="${{ steps.check.outputs.behind }}"
          TITLE="Sync from upstream ArduPilot/master ($BEHIND commits)"
          BODY=$(cat <<EOF
          Automated sync from \`ArduPilot/ardupilot:master\`.

          Fork is **$BEHIND commits** behind upstream.

          Review the changes, resolve any conflicts, and merge to bring the fork up to date.
          Triggered by \`.github/workflows/upstream_sync.yml\`.
          EOF
          )

          EXISTING=$(gh pr list --head upstream-sync --base master --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated existing PR #$EXISTING"
          else
            gh pr create --base master --head upstream-sync --title "$TITLE" --body "$BODY"
          fi
